services:
  mysql:
    image: mysql:8.4
    environment:
      MY核验规则_DATABASE: ${MY核验规则_DATABASE:-zhuatech_invoiceagent}
      MY核验规则_USER: ${MY核验规则_USER:-zhuatech}
      MY核验规则_PASSWORD: ${MY核验规则_PASSWORD:-change-me-for-local-only}
      MY核验规则_ROOT_PASSWORD: ${MY核验规则_ROOT_PASSWORD:-change-root-password}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - invoiceagent_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MY核验规则_DATABASE:-zhuatech_invoiceagent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${MY核验规则_USER:-zhuatech}
      DB_PASSWORD: ${MY核验规则_PASSWORD:-change-me-for-local-only}
      JWT_SECRET: ${JWT_SECRET:-replace-with-at-least-32-random-characters}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8090}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8090}:80"
    depends_on:
      - backend

volumes:
  invoiceagent_mysql_data:
